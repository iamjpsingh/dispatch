# Dispatch — local/self-host stack.
#   docker compose up                  # api + worker + postgres + valkey + minio
#   docker compose --profile prod up   # also runs Caddy (auto-HTTPS reverse proxy)
#
# Copy .env.example to .env first. The DATABASE_URL / REDIS_URL / S3_* below point
# at the in-compose services; override in .env for managed/external services.
# Project/group name defaults to this folder ("dispatch") -> containers become
# dispatch-postgres-1, dispatch-api-1, etc. To rename without losing your volumes/data,
# set COMPOSE_PROJECT_NAME in .env rather than hardcoding a name here.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "60", "1"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["valkeydata:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: dispatch
      MINIO_ROOT_PASSWORD: dispatch-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: Dockerfile, target: api }
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "5500"
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch
      REDIS_URL: redis://valkey:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: dispatch
      S3_SECRET_KEY: dispatch-secret
      S3_BUCKET: dispatch
    ports: ["5500:5500"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: Dockerfile, target: api }
    command: ["bun", "run", "index.ts"]   # P4 switches this to the BullMQ worker entrypoint
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      ROLE: worker
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch
      REDIS_URL: redis://valkey:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: dispatch
      S3_SECRET_KEY: dispatch-secret
      S3_BUCKET: dispatch
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:
  miniodata:
  caddydata:

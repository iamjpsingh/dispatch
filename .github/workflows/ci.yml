name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.2'
      - run: bun install --frozen-lockfile
      - name: Build all packages
        run: bunx turbo run build

  test:
    name: Test api + worker (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.2'
      - run: bun install --frozen-lockfile
      - name: Run enforced test suites
        run: bunx turbo run test --filter=@dispatch/api --filter=dispatch-tracker

  quality:
    name: Quality (advisory — tracked debt, not yet blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.2'
      - run: bun install --frozen-lockfile
      - name: Typecheck (advisory)
        run: bunx turbo run typecheck
        continue-on-error: true
      - name: Lint (advisory)
        run: bunx turbo run lint
        continue-on-error: true
      - name: Web tests (advisory — 64 pre-existing failures)
        run: bunx turbo run test --filter=@dispatch/web
        continue-on-error: true
      - name: API coverage (advisory — thresholds in apps/api/vitest.config.ts)
        run: cd apps/api && bun run test:coverage
        continue-on-error: true

  secret-scan:
    name: Secret scan (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Public repos: no license needed. Private repos: add GITLEAKS_LICENSE secret.

  compose-validate:
    name: Compose validate (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config >/dev/null

openapi: 3.0.3
info:
  title: Dispatch API
  version: 3.0.0
  description: |
    Open-source bulk email campaign platform with tracking, multi-provider support, and batch processing.

    > **Note:** This spec is maintained by hand and may lag the implementation. Treat the live API
    > (and the route handlers under `apps/api/src/routes`) as the source of truth. Browse it interactively
    > at `/docs` (Swagger UI) on any running instance.

    ## Authentication
    Most endpoints require authentication via a `session_token` cookie obtained from the login endpoint.
    Alternatively, an API key can be passed via the `X-API-Key` header.

    ## CSRF Protection
    All mutation endpoints (POST, PUT, DELETE) require a valid `X-CSRF-Token` header.
    The CSRF token is issued as a cookie on every response.

    ## Common Response Format
    All endpoints return a standard envelope:
    ```json
    {
      "success": true,
      "data": { ... },
      "message": "Human-readable message",
      "meta": { "pagination": { ... } }
    }
    ```
  contact:
    name: Dispatch
    url: https://github.com/iamjpsingh/bulk-email-sender
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
    description: Health check and API info
  - name: Auth
    description: Authentication and session management
  - name: Config
    description: SMTP configuration management
  - name: Send
    description: Email sending, batch processing, and scheduling
  - name: Campaigns
    description: Campaign lifecycle management and A/B testing
  - name: Contacts
    description: Contact lists, contacts CRUD, import, and validation
  - name: Templates
    description: Email template management
  - name: Automations
    description: Drip sequence and automation management
  - name: Analytics
    description: Advanced analytics, device and geo breakdowns
  - name: Queue
    description: Persistent job queue, dead letters, and suppression
  - name: Reports
    description: Email logs, stats, and exports
  - name: Dashboard
    description: Dashboard stats and polling

# ---------------------------------------------------------------------------
# Security Schemes
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_token
      description: Session token cookie set on login/register.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for programmatic access.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token required for POST/PUT/DELETE requests. Value is read from the `csrf_token` cookie.

  # -------------------------------------------------------------------------
  # Reusable Schemas
  # -------------------------------------------------------------------------
  schemas:
    # -- Envelope --
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Response payload (shape varies per endpoint).
        message:
          type: string
        meta:
          type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'
      required: [success]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Something went wrong
        error:
          type: string
      required: [success, message]

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5
        hasMore:
          type: boolean
          example: true

    # -- Auth --
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
      required: [id, email, name]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required: [email, password]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          format: password
          minLength: 8
      required: [email, name, password]

    # -- Config --
    SMTPConfig:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider_type:
          type: string
          enum: [smtp, google, microsoft]
        host:
          type: string
        port:
          type: integer
        secure:
          type: boolean
        user:
          type: string
        from_email:
          type: string
          format: email
        from_name:
          type: string
        is_default:
          type: boolean
        oauth_email:
          type: string
          format: email
          nullable: true
        created_at:
          type: string
          format: date-time

    SMTPConfigCreate:
      type: object
      properties:
        name:
          type: string
          default: Default Configuration
        host:
          type: string
          example: smtp.gmail.com
        port:
          type: integer
          default: 587
        secure:
          type: boolean
          default: false
        user:
          type: string
        pass:
          type: string
          format: password
        fromEmail:
          type: string
          format: email
        fromName:
          type: string
        isDefault:
          type: boolean
      required: [host, user, pass, fromEmail]

    SMTPConfigUpdate:
      type: object
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        secure:
          type: boolean
        user:
          type: string
        pass:
          type: string
          format: password
        fromEmail:
          type: string
          format: email
        fromName:
          type: string
        isDefault:
          type: boolean

    SMTPTestRequest:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
          default: 587
        secure:
          type: boolean
        user:
          type: string
        pass:
          type: string
          format: password
      required: [host, user, pass]

    # -- Campaigns --
    Campaign:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        from_email:
          type: string
          format: email
        from_name:
          type: string
        type:
          type: string
          enum: [regular, ab_test, automated]
        status:
          type: string
          enum: [draft, testing, scheduled, sending, paused, completed, cancelled, archived]
        total_recipients:
          type: integer
        sent_count:
          type: integer
        open_count:
          type: integer
        click_count:
          type: integer
        created_at:
          type: string
          format: date-time
        scheduled_at:
          type: string
          format: date-time
          nullable: true

    CampaignCreate:
      type: object
      properties:
        name:
          type: string
        subject:
          type: string
        from_email:
          type: string
          format: email
        from_name:
          type: string
        type:
          type: string
          enum: [regular, ab_test, automated]
        html_content:
          type: string
        template_id:
          type: string
        list_id:
          type: string
        config_id:
          type: string
        folder:
          type: string
      required: [name, subject, from_email, from_name]

    CampaignStats:
      type: object
      properties:
        total_recipients:
          type: integer
        sent:
          type: integer
        failed:
          type: integer
        opened:
          type: integer
        clicked:
          type: integer
        bounced:
          type: integer
        unsubscribed:
          type: integer
        open_rate:
          type: number
          format: float
        click_rate:
          type: number
          format: float

    ABVariantCreate:
      type: object
      properties:
        label:
          type: string
          default: A
        percentage:
          type: integer
          default: 50
        subject:
          type: string
        template_id:
          type: string
        sender_name:
          type: string
        sender_email:
          type: string

    # -- Contacts --
    ContactList:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        contact_count:
          type: integer
        created_at:
          type: string
          format: date-time

    Contact:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        company:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [active, unsubscribed, bounced, complained]
        tags:
          type: string
        custom_fields:
          type: object
        created_at:
          type: string
          format: date-time

    ContactCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        company:
          type: string
        phone:
          type: string
        tags:
          type: string
        custom_fields:
          type: object
      required: [email]

    # -- Templates --
    Template:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        html_content:
          type: string
        category:
          type: string
          enum: [marketing, transactional, notification, newsletter, custom]
        variables:
          type: string
          description: JSON-encoded array of variable names
        is_starter:
          type: boolean
        created_at:
          type: string
          format: date-time

    TemplateCreate:
      type: object
      properties:
        name:
          type: string
        subject:
          type: string
        html_content:
          type: string
        category:
          type: string
          enum: [marketing, transactional, notification, newsletter, custom]
      required: [name, html_content]

    # -- Automations --
    Automation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        trigger_type:
          type: string
          enum: [list_join, tag_added, manual, scheduled, webhook]
        status:
          type: string
          enum: [draft, active, paused, completed]
        trigger_config:
          type: string
          description: JSON-encoded trigger configuration
        total_enrolled:
          type: integer
        total_completed:
          type: integer
        created_at:
          type: string
          format: date-time
        steps:
          type: array
          description: Only included when fetching a single automation.
          items:
            type: object

    AutomationCreate:
      type: object
      properties:
        name:
          type: string
        trigger_type:
          type: string
          enum: [list_join, tag_added, manual, scheduled, webhook]
        trigger_config:
          type: object
        steps:
          type: array
          items:
            type: object
      required: [name, trigger_type]

    # -- Queue --
    JobSummary:
      type: object
      properties:
        id:
          type: string
        campaign_id:
          type: string
          nullable: true
        type:
          type: string
          enum: [direct, batch, scheduled, automation]
        status:
          type: string
          enum: [pending, running, paused, completed, failed, cancelled]
        priority:
          type: integer
        subject:
          type: string
        from_email:
          type: string
        config_name:
          type: string
        total_count:
          type: integer
        sent_count:
          type: integer
        failed_count:
          type: integer
        last_processed_index:
          type: integer
        batch_size:
          type: integer
        progress:
          type: integer
          description: Percentage 0-100.
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true

    QueueStats:
      type: object
      properties:
        pending:
          type: integer
        running:
          type: integer
        paused:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
        total_sent:
          type: integer
        total_failed:
          type: integer
        dead_letters:
          type: integer

    SuppressionEntry:
      type: object
      properties:
        email:
          type: string
          format: email
        reason:
          type: string
        source:
          type: string
        created_at:
          type: string
          format: date-time

    # -- Reports --
    EmailLog:
      type: object
      properties:
        id:
          type: string
        recipient_email:
          type: string
          format: email
        recipient_name:
          type: string
        subject:
          type: string
        status:
          type: string
        send_type:
          type: string
        provider_type:
          type: string
        config_name:
          type: string
        sent_at:
          type: string
          format: date-time
        opened_at:
          type: string
          format: date-time
          nullable: true
        open_count:
          type: integer
        click_count:
          type: integer

    LogStats:
      type: object
      properties:
        sent:
          type: integer
        failed:
          type: integer
        total:
          type: integer

    # -- Dashboard --
    DashboardStats:
      type: object
      properties:
        stats:
          $ref: '#/components/schemas/LogStats'
        queue:
          type: object
          properties:
            stats:
              $ref: '#/components/schemas/QueueStats'
            activeJobs:
              type: array
              items:
                $ref: '#/components/schemas/JobSummary'
            pendingJobs:
              type: array
              items:
                $ref: '#/components/schemas/JobSummary'
            recentJobs:
              type: array
              items:
                $ref: '#/components/schemas/JobSummary'
        scheduledJobs:
          type: array
          items:
            type: object
        recentLogs:
          type: array
          items:
            $ref: '#/components/schemas/EmailLog'
        timestamp:
          type: string
          format: date-time

    PollStatus:
      type: object
      properties:
        pollNeeded:
          type: boolean
        pollInterval:
          type: integer
          description: Recommended polling interval in milliseconds.
        hasActiveJobs:
          type: boolean
        hasPendingJobs:
          type: boolean
        hasScheduledJobs:
          type: boolean
        hasRunningScheduledJobs:
          type: boolean
        activeJobCount:
          type: integer
        pendingJobCount:
          type: integer
        pausedJobCount:
          type: integer
        scheduledJobCount:
          type: integer
        lastUpdated:
          type: string
          format: date-time

  # -------------------------------------------------------------------------
  # Reusable Parameters
  # -------------------------------------------------------------------------
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    SearchParam:
      name: search
      in: query
      schema:
        type: string

# ---------------------------------------------------------------------------
# Default Security
# ---------------------------------------------------------------------------
security:
  - cookieAuth: []
  - apiKeyAuth: []

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # =========================================================================
  # Health
  # =========================================================================
  /:
    get:
      tags: [Health]
      summary: API information
      operationId: getApiInfo
      security: []
      responses:
        '200':
          description: API info with available endpoint groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  name:
                    type: string
                  version:
                    type: string
                  documentation:
                    type: object
                  endpoints:
                    type: object

  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string

  # =========================================================================
  # Auth
  # =========================================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Account created. Session cookie set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
        '400':
          description: Validation error or email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful. Session cookie set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      operationId: logout
      security: []
      responses:
        '200':
          description: Session destroyed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current authenticated user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated or session expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # Config
  # =========================================================================
  /config/list:
    get:
      tags: [Config]
      summary: List all SMTP configurations
      operationId: listConfigs
      responses:
        '200':
          description: Array of user configurations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          configs:
                            type: array
                            items:
                              $ref: '#/components/schemas/SMTPConfig'

  /config/smtp:
    get:
      tags: [Config]
      summary: Get SMTP configurations (legacy)
      operationId: getSmtpConfigs
      responses:
        '200':
          description: SMTP configurations with default indicator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

    post:
      tags: [Config]
      summary: Create SMTP configuration
      operationId: createSmtpConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMTPConfigCreate'
      responses:
        '200':
          description: Configuration created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          configId:
                            type: string
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /config/smtp/active:
    get:
      tags: [Config]
      summary: Get active (default) configuration
      operationId: getActiveConfig
      responses:
        '200':
          description: Active configuration or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /config/smtp/{configId}:
    put:
      tags: [Config]
      summary: Update SMTP configuration
      operationId: updateSmtpConfig
      parameters:
        - name: configId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMTPConfigUpdate'
      responses:
        '200':
          description: Configuration updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Configuration not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Config]
      summary: Delete SMTP configuration
      operationId: deleteSmtpConfig
      parameters:
        - name: configId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Configuration deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Configuration not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /config/smtp/{configId}/default:
    post:
      tags: [Config]
      summary: Set a configuration as default
      operationId: setDefaultConfig
      parameters:
        - name: configId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Default configuration updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Configuration not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /config/smtp/test:
    post:
      tags: [Config]
      summary: Test SMTP connection with ad-hoc credentials
      operationId: testSmtpConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMTPTestRequest'
      responses:
        '200':
          description: Connection test result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          valid:
                            type: boolean

  /config/test/{configId}:
    post:
      tags: [Config]
      summary: Test a saved SMTP configuration
      operationId: testSavedConfig
      parameters:
        - name: configId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connection test result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          valid:
                            type: boolean
        '404':
          description: Configuration not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # Send
  # =========================================================================
  /send:
    post:
      tags: [Send]
      summary: Send emails to a list of contacts
      operationId: sendEmails
      description: |
        Accepts a multipart form with an Excel file of contacts, HTML content, and sending options.
        Supports immediate, batched, and scheduled sending modes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                excelFile:
                  type: string
                  format: binary
                  description: Excel file (.xlsx) with contact data.
                subject:
                  type: string
                htmlContent:
                  type: string
                  description: HTML body content (from WYSIWYG editor).
                htmlTemplate:
                  type: string
                  format: binary
                  description: Optional HTML template file (overrides htmlContent).
                configId:
                  type: string
                  description: SMTP config ID to use. Falls back to default.
                delay:
                  type: integer
                  default: 20
                  description: Delay in seconds between emails (non-batch mode).
                useBatch:
                  type: string
                  enum: ['on']
                  description: Enable batch mode.
                batchSize:
                  type: integer
                  default: 20
                batchDelay:
                  type: integer
                  default: 60
                  description: Delay in seconds between batches.
                emailDelay:
                  type: integer
                  default: 45
                  description: Delay in seconds between emails within a batch.
                scheduleEmail:
                  type: string
                  enum: ['on']
                  description: Enable scheduling.
                scheduledTime:
                  type: string
                  format: date-time
                  description: ISO 8601 datetime for scheduled send.
                notifyEmail:
                  type: string
                  format: email
                  description: Email address for job completion notification.
                emailRangeStart:
                  type: integer
                  default: 0
                  description: Starting index in the contact list.
                emailRangeCount:
                  type: integer
                  description: Number of contacts to send to.
              required: [excelFile, subject]
      responses:
        '200':
          description: Sending initiated or job scheduled.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          jobId:
                            type: string
                          contactCount:
                            type: integer
                          configUsed:
                            type: string
                          batchMode:
                            type: boolean
                          scheduledMode:
                            type: boolean
                          scheduledTime:
                            type: string
                            format: date-time
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


      responses:
        '200':
          description: Dead letter entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object

  /queue/suppression:
    get:
      tags: [Queue]
      summary: Get suppression list
      operationId: getSuppressionList
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Suppression list entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SuppressionEntry'

    post:
      tags: [Queue]
      summary: Add email to suppression list
      operationId: suppressEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                reason:
                  type: string
              required: [email, reason]
      responses:
        '200':
          description: Email suppressed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Email and reason are required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /queue/suppression/{email}:
    delete:
      tags: [Queue]
      summary: Remove email from suppression list
      operationId: unsuppressEmail
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Email unsuppressed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Email not found in suppression list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # Reports
  # =========================================================================
  /report/logs:
    get:
      tags: [Reports]
      summary: Get email logs with filtering
      operationId: getEmailLogs
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: send_type
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
        - name: campaign_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/SearchParam'
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated email logs with stats.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          logs:
                            type: array
                            items:
                              $ref: '#/components/schemas/EmailLog'
                          stats:
                            $ref: '#/components/schemas/LogStats'
                          pagination:
                            $ref: '#/components/schemas/Pagination'

  /report/stats:
    get:
      tags: [Reports]
      summary: Get email statistics
      operationId: getEmailStats
      responses:
        '200':
          description: Email statistics.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LogStats'

  /report/export/csv:
    get:
      tags: [Reports]
      summary: Export logs as CSV
      operationId: exportLogsCsv
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: send_type
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: CSV file download.
          content:
            text/csv:
              schema:
                type: string

  /report/export/json:
    get:
      tags: [Reports]
      summary: Export logs as JSON
      operationId: exportLogsJson
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: send_type
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: JSON file download.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailLog'

  /report/logs/{id}:
    delete:
      tags: [Reports]
      summary: Delete a single email log
      operationId: deleteLog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Log deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /report/logs/delete-bulk:
    post:
      tags: [Reports]
      summary: Bulk delete email logs
      operationId: bulkDeleteLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
              required: [ids]
      responses:
        '200':
          description: Logs deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: integer
        '400':
          description: No log IDs provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # Dashboard
  # =========================================================================
  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Get full dashboard statistics
      operationId: getDashboardStats
      responses:
        '200':
          description: Dashboard data with queue, scheduled jobs, and recent logs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardStats'

  /dashboard/poll-status:
    get:
      tags: [Dashboard]
      summary: Lightweight polling status
      operationId: getPollStatus
      description: |
        Returns whether the client should continue polling and at what interval.
        Use this to implement adaptive polling on the frontend.
      responses:
        '200':
          description: Polling recommendation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PollStatus'

  /dashboard/data:
    get:
      tags: [Dashboard]
      summary: Get active dashboard data (optimized)
      operationId: getDashboardData
      description: Returns only active/pending jobs and upcoming scheduled jobs.
      responses:
        '200':
          description: Active dashboard data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =========================================================================
  # Admin — org settings, sender identity, audit/activity logs, GDPR (P7–P8).
  # Added in the P9 freshness pass; see the note in info.description. All admin
  # routes are tenant-scoped and RBAC-gated (permission shown per operation).
  # =========================================================================
  /admin/org/sender-identity:
    get:
      tags: [Admin]
      summary: Get the org sender identity (CAN-SPAM postal address, from-name/email)
      operationId: getSenderIdentity
      description: Requires the `org.view` permission.
      responses:
        '200':
          description: Sender identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    put:
      tags: [Admin]
      summary: Update the org sender identity
      operationId: updateSenderIdentity
      description: Requires the `org.manage` permission. Postal address is required for CAN-SPAM compliance before launching campaigns.
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: List the org audit log (append-only security/compliance events)
      operationId: listAuditLogs
      description: Requires the `audit.view` permission.
      responses:
        '200':
          description: Array of audit-log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /admin/activity-logs:
    get:
      tags: [Admin]
      summary: List the org activity feed (user-facing actions)
      operationId: listActivityLogs
      description: Requires the `logs.view` permission.
      responses:
        '200':
          description: Array of activity entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /admin/contacts/{id}/gdpr-export:
    get:
      tags: [Admin]
      summary: GDPR DSAR export — all stored data for one contact
      operationId: gdprExportContact
      description: Requires the `gdpr.manage` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The contact's exported data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/contacts/{id}/gdpr-erase:
    post:
      tags: [Admin]
      summary: GDPR right-to-erasure — anonymize a contact and suppress by hash
      operationId: gdprEraseContact
      description: Requires the `gdpr.manage` permission. Anonymizes the contact, cascades to related rows, and adds the email hash to the suppression list so it can never be re-imported.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Erased.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
